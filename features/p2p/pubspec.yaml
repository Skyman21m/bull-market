name: p2p
description: Troc peer-to-peer trading on the RoboSats federation, read over the embedded Tor.
publish_to: "none"
version: 0.0.1
resolution: workspace

environment:
  sdk: "3.12.2"
  flutter: "3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bull_logger:
  bull_tor:
  bull_ui:
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  get_it: ^9.1.1
  go_router: ^17.0.0
  intl: any
  meta: ^1.17.0
  primitives:
  robosats:
  # The capture protection of the screens that show a Garage Key, as the wallet's seed screens have it.
  screen_privacy:
  # Only for the Garage Key handle that the shell passes to the feature: see `GarageKeyRepositoryImpl`.
  secrets:

dev_dependencies:
  # Parses the feature's own sources in its architecture tests: see `secrets_imports_test.dart`.
  analyzer: ^10.2.0
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  socks5_proxy: ^2.1.1
  test: ^1.31.0

flutter:
  uses-material-design: true
  generate: true
