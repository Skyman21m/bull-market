include: package:lints/recommended.yaml

linter:
  rules:
    # Nothing of the feature prints: a printed line can carry key material past every other check.
    - avoid_print
    - implementation_imports
    - prefer_final_locals
    - require_trailing_commas
    - use_super_parameters

analyzer:
  errors:
    # Reaching into another package's src/ is a boundary violation, not a style preference.
    implementation_imports: error
