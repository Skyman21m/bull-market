name: Analyze and Test

# CI de Troc, dérivée de celle de Bull Bitcoin (SatoshiPortal/bullbitcoin-mobile).
# Retiré par rapport à Bull : le job « PR readiness » (politique de tickets propre
# à Bull), le job d'intégration (il dépense depuis des portefeuilles testnet
# partagés dont nous n'avons pas les secrets) et les tests Node de la politique
# de gouvernance des PR. Conservé : classification docs-only, épinglage des
# actions par SHA, analyse statique, garde-fous custody, tests unitaires.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Checkout + tests only; no writes to the repo via the token.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same PR — these builds are heavy, so don't run
# stale commits to completion when newer ones are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two cheap prechecks gate the `checks` job (analyze + fix + format + unit
# tests). It never compiles the Rust FRB crates — unit tests run on the Dart VM
# against the bindings' Dart side only.
jobs:
  classification:
    name: Detect docs-only PR
    runs-on: ubuntu-24.04
    outputs:
      run_app_checks: ${{ steps.classify.outputs.run_app_checks }}
    steps:
      - name: Classify pull request files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_app_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api_url="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files"
          page=1
          file_count=0
          run_app_checks=false

          while :; do
            response=$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 1 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?per_page=100&page=${page}")

            if ! jq -e 'type == "array"' >/dev/null <<<"$response"; then
              echo "Changed-file API returned a non-array response" >&2
              exit 1
            fi
            if ! jq -e 'all(.[]; type == "object" and (.filename | type == "string"))' >/dev/null <<<"$response"; then
              echo "Changed-file API returned an invalid file entry" >&2
              exit 1
            fi

            page_count=$(jq 'length' <<<"$response")
            while IFS= read -r path; do
              file_count=$((file_count + 1))
              case "$path" in
                *.md|docs/*|LICENSE|.gitignore|.git-blame-ignore-revs|.github/ISSUE_TEMPLATE/*)
                  ;;
                *)
                  run_app_checks=true
                  ;;
              esac
            done < <(jq -r '.[].filename // empty' <<<"$response")

            (( page_count < 100 )) && break
            page=$((page + 1))
          done

          if (( file_count == 0 )); then
            echo "Changed-file enumeration returned an impossible empty set" >&2
            exit 1
          fi

          echo "Enumerated ${file_count} changed file(s); application checks: ${run_app_checks}"
          echo "run_app_checks=${run_app_checks}" >> "$GITHUB_OUTPUT"

  action-pins:
    name: Check action pins
    runs-on: ubuntu-24.04
    steps:
      # Bootstrap from the immutable commit that introduced the checker
      # (inherited from Bull's history). Checker upgrades require an explicit
      # SHA bump here.
      - name: Checkout candidate tree (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout trusted checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: 79342f5f4e761f020453d0f78e42b15791f08faf
          persist-credentials: false
      - name: Verify external action pins
        run: bash trusted/tools/check_action_pins.sh "$GITHUB_WORKSPACE/candidate"

  checks:
    needs: [classification, action-pins]
    if: ${{ !cancelled() && needs.classification.result == 'success' && needs.action-pins.result == 'success' && needs.classification.outputs.run_app_checks == 'true' }}
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    # A normal run takes 22-29 min (build_runner and unit tests dominate).
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Custody policy tests and imports (CI only)
        run: make custody-ci-test custody-ci-check

      # Kept deliberately: a local .dart_tool can reach 16GB and a stock x64
      # runner has ~21GB free, so dropping this risks turning every PR red on
      # "No space left on device".
      - name: Free disk space
        # Pinned to a commit SHA (not the mutable v1.3.1 tag): third-party action.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      # The gates below reference steps.setup.outcome — if this `id` is ever
      # renamed, the expression silently evaluates to '' and every check
      # SKIPS (job goes green with nothing run). Keep id and gates in sync.
      - name: Flutter setup
        id: setup
        uses: ./.github/actions/flutter-setup

      # Static checks are gated on `!cancelled()` + setup success instead of
      # the implicit success(): one CI run surfaces ALL static failures instead
      # of stopping at the first. `make checks` runs the same gates locally.
      - name: Linter shouldn't raise errors, warnings or infos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make analyze

      - name: bull_ui import boundary (coins/ui imports only package:bull_ui)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make bull-ui-check

      - name: Custody key material (resolved derivation and vault decryption)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make custody-check

      - name: Secrets public API trees should be current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make secrets-api-docs-check

      - name: dart fix should have nothing to suggest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make fix-check

      - name: dart format should have nothing to change
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make format-check

      # Default success() gate on purpose: if any static check above is red,
      # skip the tests — the PR needs another push anyway.
      - name: Unit tests must pass
        run: make unit-test

  # Single status to require on `main`: green for docs-only PRs (application
  # checks skipped) and for application PRs whose checks passed.
  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [classification, action-pins, checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the expected checks
        env:
          CLASSIFICATION_RESULT: ${{ needs.classification.result }}
          RUN_APP_CHECKS: ${{ needs.classification.outputs.run_app_checks }}
          ACTION_PINS_RESULT: ${{ needs.action-pins.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail

          [[ "$CLASSIFICATION_RESULT" == success ]] || {
            echo "Classification result was ${CLASSIFICATION_RESULT}, expected success" >&2
            exit 1
          }
          [[ "$ACTION_PINS_RESULT" == success ]] || {
            echo "Action-pin result was ${ACTION_PINS_RESULT}, expected success" >&2
            exit 1
          }

          case "$RUN_APP_CHECKS" in
            true)
              [[ "$CHECKS_RESULT" == success ]] || {
                echo "Application checks result was ${CHECKS_RESULT}, expected success" >&2
                exit 1
              }
              ;;
            false)
              [[ "$CHECKS_RESULT" == skipped ]] || {
                echo "Docs-only PR expected the application checks to be skipped; got checks=${CHECKS_RESULT}" >&2
                exit 1
              }
              ;;
            *)
              echo "Classification output was '${RUN_APP_CHECKS}', expected true or false" >&2
              exit 1
              ;;
          esac
