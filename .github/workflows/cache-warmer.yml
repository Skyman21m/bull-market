name: Cache Warmer

# PR-saved Actions caches are scoped to the PR branch — they are NOT shared
# between PRs. Caches saved on the base branch ARE visible to every PR
# targeting it. This workflow runs the shared setup (FVM SDK, pub, build_runner
# outputs) on each main push so every fresh PR restores warm caches instead
# of paying the full ~10min prefix. x64 only: Troc's analyze_and_test runs its
# single `checks` job on x64 (the arm64 integration job of Bull was dropped).
# The Cargo cache is NOT warmed here: it only fills during an actual Rust build, which this workflow deliberately
# avoids.
on:
  push:
    branches:
      - main
    # Docs-only merges don't change any cache input — skip the ~10min warm.
    # Keep in sync with the docs-only classification in analyze_and_test.yml
    # and the paths-ignore in build-android.yml.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-*'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

# Only the newest main push matters for cache freshness.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # x64 stock images are tight on disk once the SDK + pub + build_runner
      # output land (see the checks job in analyze_and_test.yml).
      - name: Free disk space
        # Pinned to a commit SHA (not the mutable v1.3.1 tag): third-party action.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      # The composite only RESTORES the build_runner cache (PR jobs must never
      # save — quota); this workflow is the single writer. Keep path + key in
      # sync with the restore step in .github/actions/flutter-setup/action.yml.
      - name: Save build_runner cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .dart_tool/build
            **/*.g.dart
            **/*.freezed.dart
            **/*.mocks.dart
            **/*.gen.dart
            **/*.gr.dart
            **/*.config.dart
            !packages/bull_ui_catalogue/lib/main.directories.g.dart
          key: buildrunner-${{ hashFiles('.github/actions/flutter-setup/action.yml', '.github/workflows/cache-warmer.yml') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
