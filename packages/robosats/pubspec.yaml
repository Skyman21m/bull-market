name: robosats
description: >-
  Pure-Dart RoboSats client primitives for the Troc monorepo: Garage Key,
  robot token, the robot identity derived from it (coordinator token hash,
  hash id, nickname, Nostr key, Authorization header), the robot OpenPGP
  key (generation, clear-signed invoices, encrypted and signed chat) and the
  read-only coordinator client with the embedded federation list.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bech32: ^0.2.2
  # BIP-340 Schnorr signatures of the Nostr events of the chat (#94), by the author of the Nostr protocol; pinned exactly.
  # 0.3.0, not 0.3.1: 0.3.1 requires pointycastle ^4 while the workspace is on pointycastle ^3 (bip85_entropy, dart_pg); the code of lib/ is identical in both. Move to 0.3.1 with pointycastle 4.
  bip340: 0.3.0
  convert: ^3.1.2
  crypto: ^3.0.7
  meta: ^1.17.0
  pinenacl: ^0.6.0
  pointycastle: ^3.9.1
  primitives:

dev_dependencies:
  bip32_keys: ^3.1.4
  lints: ^6.0.0
  test: ^1.26.3
